# System under test of spin-trainer-qa, the same for all three layers (API, Newman, Playwright):
#   postgres  Postgres 17 set up like production (the API's bootstrap.sql: roles spin_migrator/spin_app)
#   jwks      WireMock playing Supabase Auth: serves the JWKS of the QA key (env/jwt) and accepts the logout
#   api       the API built from ../../spin-trainer-api (sibling repos) with the QA reference data
#
#   docker compose -f env/docker-compose.yml up -d --build --wait
#   docker compose -f env/docker-compose.yml down -v
name: spin-trainer-qa

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: spintrainer
      SPIN_MIGRATOR_PASSWORD: migrator-qa
      SPIN_APP_PASSWORD: app-qa
    volumes:
      - ../../spin-trainer-api/src/main/resources/db/bootstrap/bootstrap.sql:/bootstrap/bootstrap.sql:ro
      - ./postgres/10-bootstrap.sh:/docker-entrypoint-initdb.d/10-bootstrap.sh:ro
    ports:
      - "55432:5432"
    healthcheck:
      # Over TCP: while the init scripts run, the entrypoint's temporary server only listens on the Unix socket, and
      # pg_isready without -h would report it ready before the API (JDBC over TCP) can connect.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d spintrainer"]
      interval: 2s
      retries: 30

  jwks:
    image: wiremock/wiremock:3.13.1
    # CORS: the E2E browser (web in http mode) calls this "Supabase" on logout.
    command: ["--disable-banner", "--enable-stub-cors"]
    volumes:
      - ./wiremock:/home/wiremock
    ports:
      - "8089:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/__admin/health || exit 1"]
      interval: 2s
      retries: 30

  api:
    build: ../../spin-trainer-api
    image: spin-trainer-api:local
    depends_on:
      postgres: { condition: service_healthy }
      jwks: { condition: service_healthy }
    environment:
      # The issuer of the QA tokens: the API validates the signature against WireMock's JWKS, just as against Supabase.
      SUPABASE_URL: http://jwks:8080
      DB_URL: jdbc:postgresql://postgres:5432/spintrainer
      DB_APP_PASSWORD: app-qa
      DB_MIGRATOR_PASSWORD: migrator-qa
      # QA reference data, loaded by Flyway after the API's migrations.
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,filesystem:/qa-seed
      CORS_ALLOWED_ORIGINS: http://localhost:4173,http://localhost:4174
    volumes:
      - ./flyway:/qa-seed:ro
    ports:
      - "8081:8080"
    healthcheck:
      # The image has no curl: HTTP request with bash to the readiness probe.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 3s
      retries: 40
      start_period: 10s
