name: qa

# Full suite against the system built from the sibling repos: API (JUnit + Cucumber), Newman and E2E
# (Playwright against the mock and against the real API), with a combined Allure report.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      api-ref:
        description: Branch, tag or commit of spin-trainer-api (empty = the same branch as here if it exists; otherwise main)
        required: false
      web-ref:
        description: Branch, tag or commit of spin-trainer-web (empty = the same branch as here if it exists; otherwise main)
        required: false
  schedule:
    # Mondays 05:17 UTC: catches API or web changes that break the suite even if nothing is touched here.
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

env:
  LANG: C.UTF-8

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      pages-artifact: ${{ steps.pages-artifact.outcome }}
    steps:
      - name: Checkout spin-trainer-qa
        uses: actions/checkout@v7
        with:
          path: spin-trainer-qa
          persist-credentials: false

      # Coordinated changes across repos: the same branch in all three if it exists; otherwise, main.
      # The repos are private: read-only token (Contents: read) on spin-trainer-api and spin-trainer-web in the
      # SPIN_TRAINER_REPOS_TOKEN secret (if they become public, the Actions token is enough). Only this step and the
      # two checkouts see it, and it is not left in .git/config: the dependency installs and builds that follow
      # cannot read it.
      - name: Choose the API and web versions
        id: refs
        env:
          SIBLINGS_TOKEN: ${{ secrets.SPIN_TRAINER_REPOS_TOKEN || github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          API_REF: ${{ inputs.api-ref }}
          WEB_REF: ${{ inputs.web-ref }}
        run: |
          pick() {
            if [ -n "$2" ]; then echo "$2"; return; fi
            # --exit-code: 2 means the branch does not exist; anything else (auth, network) must not fall back to main.
            status=0
            git ls-remote --exit-code --heads "https://x-access-token:${SIBLINGS_TOKEN}@github.com/pedromorago/$1.git" "$BRANCH" > /dev/null || status=$?
            case $status in
              0) echo "$BRANCH" ;;
              2) echo main ;;
              *) echo "::error::Could not read pedromorago/$1 (git ls-remote exit $status): check SPIN_TRAINER_REPOS_TOKEN." >&2; return 1 ;;
            esac
          }
          set -e
          api=$(pick spin-trainer-api "$API_REF")
          web=$(pick spin-trainer-web "$WEB_REF")
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"

      - name: Checkout spin-trainer-api (${{ steps.refs.outputs.api }})
        uses: actions/checkout@v7
        with:
          repository: pedromorago/spin-trainer-api
          ref: ${{ steps.refs.outputs.api }}
          token: ${{ secrets.SPIN_TRAINER_REPOS_TOKEN || github.token }}
          persist-credentials: false
          path: spin-trainer-api

      - name: Checkout spin-trainer-web (${{ steps.refs.outputs.web }})
        uses: actions/checkout@v7
        with:
          repository: pedromorago/spin-trainer-web
          ref: ${{ steps.refs.outputs.web }}
          token: ${{ secrets.SPIN_TRAINER_REPOS_TOKEN || github.token }}
          persist-credentials: false
          path: spin-trainer-web

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            spin-trainer-qa/package-lock.json
            spin-trainer-web/package-lock.json

      - name: Dependencies
        run: |
          npm ci --prefix spin-trainer-qa
          npm ci --prefix spin-trainer-web
          cd spin-trainer-qa && npx playwright install --with-deps chromium

      - name: Pinned copies (contract and reference ranges) match the API
        working-directory: spin-trainer-qa
        run: ./gradlew specCheck rangesCheck spotlessCheck

      - name: Start the QA environment
        id: env
        working-directory: spin-trainer-qa
        run: npm run env:up

      # Each suite runs even if the previous one fails: the final report collects them all.
      - name: API · JUnit and Cucumber
        if: ${{ !cancelled() && steps.env.outcome == 'success' }}
        working-directory: spin-trainer-qa
        run: ./gradlew :api-tests:test

      - name: API · Newman
        if: ${{ !cancelled() && steps.env.outcome == 'success' }}
        working-directory: spin-trainer-qa
        run: npm run newman

      - name: E2E · Playwright (mock and fullstack)
        if: ${{ !cancelled() && steps.env.outcome == 'success' }}
        working-directory: spin-trainer-qa
        run: npm run e2e:typecheck && npm run e2e

      - name: Environment logs
        if: ${{ !cancelled() && steps.env.outcome != 'skipped' }}
        working-directory: spin-trainer-qa
        run: |
          mkdir -p build
          docker compose -f env/docker-compose.yml logs --no-color > build/env.log 2>&1 || true
          docker compose -f env/docker-compose.yml down -v || true

      - name: Allure report
        if: ${{ !cancelled() }}
        working-directory: spin-trainer-qa
        run: npm run report && node scripts/report-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Publish reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: qa-reports
          retention-days: 14
          path: |
            spin-trainer-qa/build/allure-report/
            spin-trainer-qa/build/e2e/report/
            spin-trainer-qa/build/e2e/test-results/
            spin-trainer-qa/build/newman/
            spin-trainer-qa/build/env.log
            spin-trainer-qa/api-tests/build/reports/tests/

      # Public report (GitHub Pages) from main, once the repo is public and Pages uses GitHub Actions: set the
      # PUBLISH_REPORTS repository variable to true. Until then nothing is published.
      - name: Report for GitHub Pages
        id: pages-artifact
        if: ${{ !cancelled() && vars.PUBLISH_REPORTS == 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: spin-trainer-qa/build/allure-report/

  # Also when a suite failed (the report says what), but only if the qa job got as far as the report.
  pages:
    needs: qa
    if: ${{ !cancelled() && needs.qa.outputs.pages-artifact == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
